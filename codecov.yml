# The four Python versions upload one report each; a status over fewer of them would be wrong.
codecov:
  notify:
    after_n_builds: 4
comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
github_checks:
  annotations: false
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    patch:
      default:
        target: 90%
