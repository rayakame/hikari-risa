line-length = 120
target-version = "py312"

[format]
docstring-code-format = true
docstring-code-line-length = 80
quote-style = "double"
line-ending = "lf"

[lint]
preview = true
select = ["ALL"]
ignore = [
    # Comment and docstring rules are disabled while the library is being
    # (re)written; comments and docs are a dedicated pass at the end.
    "CPY", # copyright header
    "D",   # pydocstyle
    "DOC", # pydoclint
    "ERA", # commented-out code
    "FIX", # fixme comments
    "TD",  # todo comments
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # imported but unused
    "F403", # unable to detect undefined names
]
"tests/**" = [
    "S101",    # use of assert
    "PLR2004", # magic value comparison
]
"testbot/**" = [
    "ALL"
]

[lint.isort]
required-imports = ["from __future__ import annotations"]
force-single-line = true

[lint.pydocstyle]
convention = "numpy"
