line-length = 120
target-version = "py312"

[format]
docstring-code-format = true
docstring-code-line-length = 80
quote-style = "double"
line-ending = "lf"

[lint]
preview = true
select = ["ALL"]
ignore = [
    "COM812", # missing trailing comma; conflicts with the formatter, which owns trailing commas
    "D105",   # magic methods document themselves
    "DOC502", # a callee's exceptions reach the caller too, so they are documented where it can see them
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "F401", # imported but unused
    "F403", # unable to detect undefined names
]
# Docstrings are for the public API; these modules are risa's own machinery.
"risa/internal/**" = ["D1"]
"risa/dispatch.py" = ["D1"]
"risa/state/anchor.py" = ["D1"]
"risa/state/backend.py" = ["D1"]
"risa/state/message.py" = ["D1"]
"risa/state/serde.py" = ["D1"]
"risa/state/stateless.py" = ["D1"]
"risa/state/stored.py" = ["D1"]
"noxfile.py" = ["D", "DOC"]
"tests/**" = [
    "D",       # tests are not public API
    "DOC",
    "S101",    # use of assert
    "PLR2004", # magic value comparison
]
"testbot/**" = [
    "ALL"
]

[lint.pylint]
max-args = 8
max-positional-args = 5

[lint.isort]
required-imports = ["from __future__ import annotations"]
force-single-line = true

[lint.pydocstyle]
convention = "numpy"

[lint.pydoclint]
ignore-one-line-docstrings = true
