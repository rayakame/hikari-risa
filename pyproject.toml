[project]
name = "hikari-risa"
version = "1.2.0"
description = "A component handler for hikari with first-class Components V2 support."
readme = "README.md"
authors = [
    { name = "Rayakame", email = "github.android206@passmail.net" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
keywords = ["hikari", "discord", "components", "ui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    "hikari~=2.5",
    "linkd~=0.6",
    "msgspec~=0.22",
]

[project.optional-dependencies]
postgres = [
    "asyncpg~=0.32",
]
radixly = [
    "radixly~=1.0",
]
redis = [
    "redis~=8.0",
]

[project.scripts]
hikari-risa = "risa.__main__:main"

[project.urls]
Documentation = "https://hikari-risa.rayakame.dev/"
Repository = "https://github.com/rayakame/hikari-risa"
Issues = "https://github.com/rayakame/hikari-risa/issues"
Changelog = "https://hikari-risa.rayakame.dev/stable/changelog/"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risa"]

[tool.hatch.build.targets.sdist]
only-include = ["risa"]

[dependency-groups]
changelog = [
    "towncrier==26.9.0",
]
docs = [
    {include-group = "ruff"},
    "griffe-inherited-docstrings==1.1.4",
    "griffelib==2.4.1",
    "mkdocstrings-python==2.0.10",
    "pygments==2.21.0",
    "radixly~=1.0",
    "redis~=8.0",
    "zensical==0.1.1",
]
nox = [
    "nox[uv]==2026.10.20",
]
images = [
    "pillow==13.0.0",
]
lightbulb = [
    "hikari-lightbulb==3.2.7",
]
pyright = [
    "asyncpg-stubs==0.32.0",
    "pyright==1.1.414",
    {include-group = "lightbulb"},
]
ruff = [
    "ruff==0.17.4",
]
slotscheck = [
    "asyncpg~=0.32",
    "redis~=8.0",
    "slotscheck==0.21.0",
]
pytest = [
    {include-group = "images"},
    "asyncpg~=0.32",
    "coverage==7.17.3",
    "fakeredis[lua]==2.40.0",
    "griffe-inherited-docstrings==1.1.4",
    "griffelib==2.4.1",
    "pygments==2.21.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "radixly~=1.0",
    "redis~=8.0",
]

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/rayakame/hikari-risa/pull/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[tool.slotscheck]
require-subclass = true
strict-imports = true
# detect-unused-slots stays off: it cannot see msgspec Structs use the slots it
# generates for them, so every Struct in the package reports a false positive.

[tool.pyright]
include = ["risa", "tests", "tools", "docs/examples"]
exclude = [
    "**/__init__.py"
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

reportUnnecessaryTypeIgnoreComment = "error"

[tool.coverage.run]
source = ["risa"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "@typing.overload",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
    "error",
]
