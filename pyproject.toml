[project]
name = "hikari-risa"
version = "0.0.1"
description = "A component handler for hikari with first-class Components V2 support."
readme = "README.md"
authors = [
    { name = "Rayakame", email = "github.android206@passmail.net" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.16"
keywords = ["hikari", "discord", "components", "ui"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "hikari~=2.5",
    "linkd~=0.6",
    "msgspec~=0.21",
]

[project.optional-dependencies]
postgres = [
    "asyncpg~=0.32",
]
radixly = [
    "radixly~=1.0",
]
redis = [
    "redis~=8.0",
]

[project.urls]
Repository = "https://github.com/rayakame/hikari-risa"
Issues = "https://github.com/rayakame/hikari-risa/issues"

[build-system]
requires = ["hatchling>=1.14"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["risa"]

[dependency-groups]
bot = [
    "hikari-lightbulb==3.2.6",
    "python-dotenv>=1.2.2",
]
docs = [
    "mkdocstrings-python==2.0.10",
    "zensical==0.0.74",
]
nox = [
    "nox[uv]==2026.10.20",
]
images = [
    "pillow==13.0.0",
]
pyright = [
    "asyncpg-stubs==0.32.0",
    "pyright==1.1.414",
    {include-group = "bot"},
]
ruff = [
    "ruff==0.17.3",
]
slotscheck = [
    "asyncpg~=0.32",
    "redis~=8.0",
    "slotscheck==0.21.0",
]
pytest = [
    {include-group = "images"},
    "asyncpg~=0.32",
    "fakeredis[lua]==2.40.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "radixly~=1.0",
    "redis~=8.0",
]

[tool.slotscheck]
require-subclass = true
strict-imports = true
# detect-unused-slots stays off: it cannot see msgspec Structs use the slots it
# generates for them, so every Struct in the package reports a false positive.

[tool.pyright]
include = ["risa", "tests", "testbot", "tools"]
exclude = [
    "**/__init__.py"
]
pythonVersion = "3.12"
typeCheckingMode = "strict"

reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
    "error",
]
