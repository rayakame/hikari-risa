name: CI

on:
  # Only main: a branch's commits already run through its pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

# setup-uv is pinned to an exact tag on purpose: astral-sh/setup-uv does not
# publish a floating `v8` major alias (its major tags stop at v7), so `@v8`
# fails to resolve. actions/* do publish major aliases and use them.

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s format-check

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s ruff

  slots:
    name: slots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s slotscheck

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s pyright

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s audit

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s docs

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The Redis tests also run on fakeredis; the Postgres tests run only against this server.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      RISA_TEST_REDIS_URL: redis://localhost:6379/0
      RISA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    permissions:
      contents: read
      # Codecov takes the report through OIDC, so no token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Sets UV_PYTHON, which is what the nox session's venv is built from.
          python-version: ${{ matrix.python-version }}

      - run: uv run --group nox nox -s pytest
        env:
          # Colour codes would end up in junit.xml and in the traceback Codecov's comment shows.
          PY_COLORS: "0"

      # A failed run uploads both reports too: it is the one whose tests Codecov should name.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          files: coverage.xml
          disable_search: true
          flags: python-${{ matrix.python-version }}
          # A fork's pull request gets no OIDC token and uploads the way Codecov takes from public repositories.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          report_type: test_results
          files: junit.xml
          disable_search: true
          flags: python-${{ matrix.python-version }}
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}

  compat:
    name: compat (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    # The Redis tests also run on fakeredis; the Postgres tests run only against this server.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      RISA_TEST_REDIS_URL: redis://localhost:6379/0
      RISA_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        resolution: [lowest, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The session picks its own Python for each resolution; this one only runs nox.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s "compat(${{ matrix.resolution }})"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv build

      # Flat layout means a packaging mistake is invisible until install time.
      - run: uv run --no-project python -m tools.check_dist dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # The ruleset of main requires this job alone, so the jobs above can change without touching it.
  ci-done:
    name: ci-done
    needs: [format, lint, slots, typecheck, audit, docs, test, compat, build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do [ "$result" = success ] || exit 1; done
