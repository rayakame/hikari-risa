name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 1.2.0
        required: true
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  prepare:
    name: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The default token's pull request would start no checks, so an app opens it.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          python-version: "3.12"

      - env:
          VERSION: ${{ inputs.version }}
        run: uv run --locked --group nox nox -s release -- "$VERSION"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          version=$(uv version --short --color never)
          git switch --create "release/$version"
          git add --all
          git -c user.name="$ACTOR" -c user.email="$ACTOR_ID+$ACTOR@users.noreply.github.com" commit --message "Release $version"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "release/$version"
          gh pr create --base main --head "release/$version" --title "Release $version" --body "Raises the version to $version and moves \
          the changelog fragments into its section of CHANGELOG.md. Merging it publishes the release v$version to PyPI."

  release:
    name: release
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged
      && github.event.pull_request.base.ref == 'main'
      && startsWith(github.event.pull_request.head.ref, 'release/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # A release the default token publishes would not start publish.yml.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          awk -v heading="## $version " 'index($0, heading) == 1 {found = 1; next} found && /^## / {exit} found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$SHA" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"
