name: Changelog

on:
  pull_request:
    # The label that excuses a pull request from a fragment can come and go after it opens.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  fragment:
    name: fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check the fragments
        env:
          BASE: ${{ github.base_ref }}
          NUMBER: ${{ github.event.pull_request.number }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$SKIP" = true ]; then
            uv run --no-project python -m tools.changelog
          else
            git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/changed"
            uv run --no-project python -m tools.changelog --pull-request "$NUMBER" --changed "$RUNNER_TEMP/changed"
          fi
