name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: build
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # This job builds what PyPI receives, so it never restores a cache other runs wrote.
          enable-cache: false
          python-version: "3.12"

      - run: uv build

      - run: uv run --no-project python -m tools.check_dist dist

      - name: Check the tag against the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          wheel="dist/hikari_risa-${TAG#v}-py3-none-any.whl"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ ! -f "$wheel" ]; then
            echo "::error::the release tag $TAG does not match the built version: $(ls dist)"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hikari-risa/
    permissions:
      # PyPI's trusted publishing exchanges this token for an upload token, so no secret is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
