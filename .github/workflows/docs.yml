name: Docs

on:
  push:
    branches: [main]
  # publish.yml calls this for a release once PyPI has it, so the docs never name a version nobody can install.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  publish:
    name: publish
    if: (github.event_name == 'release' && !github.event.release.prerelease) || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A release gets a group of its own so a later push to main cannot replace it while it waits.
    concurrency:
      group: gh-pages-${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # This job can write to gh-pages, so it never restores a cache other runs wrote.
          enable-cache: false
          python-version: "3.12"

      - name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          if [ "$EVENT" = release ]; then
            folder=$(python3 -c 'import sys; from tools.docs.publish import release_folder; print(release_folder(sys.argv[1]))' "$TAG")
            echo "VERSION=$TAG" >> "$GITHUB_ENV"
            echo "MIKE_DOCS_VERSION=$folder" >> "$GITHUB_ENV"
          else
            echo "VERSION=main" >> "$GITHUB_ENV"
            echo "MIKE_DOCS_VERSION=main" >> "$GITHUB_ENV"
          fi

      - run: uv run --group nox nox -s docs

      - uses: ./.github/actions/push-gh-pages
        with:
          arguments: --site site --version ${{ env.VERSION }}
          message: Publish ${{ env.VERSION }} from ${{ env.SHORT_SHA }}
