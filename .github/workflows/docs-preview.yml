name: Docs preview

on:
  pull_request:

# docs-preview-remove.yml shares this group, so closing stops a build that would publish after the removal.
concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  build:
    name: build preview
    # Forks and bots stay away from the write token; only a bump of what draws the site has pages worth a preview.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.pull_request.user.type != 'Bot'
      || startsWith(github.event.pull_request.head.ref, 'renovate/lock-file-maintenance')
      || startsWith(github.event.pull_request.head.ref, 'renovate/zensical')
      || startsWith(github.event.pull_request.head.ref, 'renovate/griffe')
      || startsWith(github.event.pull_request.head.ref, 'renovate/mkdocstrings')
      || startsWith(github.event.pull_request.head.ref, 'renovate/pygments')
      || startsWith(github.event.pull_request.head.ref, 'renovate/towncrier'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv run --group nox nox -s docs
        env:
          MIKE_DOCS_VERSION: pr/${{ github.event.pull_request.number }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 1

  publish:
    name: publish preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A bug in a pull request's own publish tools must not reach gh-pages before review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - uses: ./.github/actions/push-gh-pages
        with:
          arguments: --site site --preview ${{ github.event.pull_request.number }}
          message: Preview of pull request ${{ github.event.pull_request.number }} from ${{ github.event.pull_request.head.sha }}

      - uses: ./.github/actions/preview-comment
        with:
          body: >-
            Docs preview of ${{ github.event.pull_request.head.sha }} merged into its base branch:
            https://rayakame.github.io/hikari-risa/pr/${{ github.event.pull_request.number }}/
            (Pages needs about a minute to serve a new push.)
